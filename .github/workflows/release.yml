name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Guard tag matches Directory.Build.props Version and spec release frontmatter
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
            exit 1
          fi
          release=$(sed -n 's/^release: *//p' xmlang-spec.md)
          if [ "$release" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match 'release: $release' in xmlang-spec.md frontmatter"
            exit 1
          fi
      - run: dotnet test -c Release
      - run: dotnet pack -c Release -o artifacts
      - name: NuGet login (Trusted Publishing, OIDC → short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: MartinRL
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
