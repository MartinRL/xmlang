# Blindbudet — Event-Modeling spec for one sealed-bid auction ("auktion").
# Sister spec to mer-eller-mindre.em.yaml (Mer eller Mindre). Same emlang dialect &
# conventions; see specs/CLAUDE.md. This is a SECOND Decider (AuctionState +
# its own Commands/Events/Errors) living beside MEM — it does NOT touch MEM's.
#
# Conventions (identical to mer-eller-mindre.em.yaml):
#   triggers carry the actor role + originating screen
#                                  (host / Auction catalog, Player / Lot, System / ...)
#   commands are bare              (OpenAuction, PlaceBid)
#   events carry the stream        (Game / AuctionOpened)
#   exceptions are bare            (AuctionNotFound)
#   screen views are bare data nouns; State/Todo views carry a lane
#                                  (Roster, Todo / Outstanding bids)
#
# View lanes:
#   State / ...   the decider's decision model (folded AuctionState); read by `decide`
#   Todo / ...    processor-facing read-models the System observes (never shown)
#   bare noun     human screens, named for the DATA they carry (Roster, Round scores)
# NOTE: emlang renders views by bare name (no per-view lane label); the prefix still
#   documents intent and maps to code, exactly as in mer-eller-mindre.em.yaml.
#
# Verification is decider-true: Given -> State / Game (prior events folded via evolve),
# When -> command, Then -> events | x. emlang has no `state` element, so every
# command/processor slice expresses its Given as the View State / Game (the single
# folded decision model — one Decider per auction, one State). A GWT case asserts only
# the props its `decide` actually reads.
#
# Automations are the Event-Modeling PROCESSOR pattern (no cog element):
#   event(s) -> Todo read-model -> System trigger -> command -> event(s) -> Screen.
# The auction is co-located (one room) so gears fire on a STATE CONDITION, never a
# clock — NO timeouts.
#
# GAME MODEL — sealed bid, 0-100-artad (overbid is disqualified), the MEM-tvilling
# WITHOUT the twåstegsraket (one stage: hidden bid -> reveal + score):
#   Each round a LOT with a hidden trueWorth is shown. Every player places ONE hidden
#   bid. Once all bids are in, the System reveals + scores by the 0-100 rule:
#     validBids   = bids ≤ trueWorth        (OVERBID → 0 points, marked ✗, never a winner)
#     winningBid  = the HIGHEST valid bid    (none if ALL players overbid → no winner)
#     winnerIds   = ALL players whose bid == winningBid (SHARED win, no tiebreak)
#     winnerProfit = winningBid == trueWorth ? 10                                 (exact = flat 10)
#                  : round((trueWorth - winningBid) / trueWorth * 100)  // 0-100, NEVER negative
#     non-winners = 0
#   Per-player score is NORMALIZED to % of the lot's own trueWorth so lots of wildly
#   different magnitudes score comparably (an Everest-height lot no longer drowns a
#   banana-calorie lot; mirrors MEM's normalize-by-magnitude philosophy). Bids are placed
#   in real units; only scoring normalizes. Overbidding is DISQUALIFIED (0, ✗) — there is
#   NO negative profit / no "vinnarens förbannelse". An exact bid is lifted from raw-profit
#   0 to a flat 10 ("du prickade rätt"). Bids & worths are decimal (the author types real
#   figures, sv-SE); profit/totalScore are whole points (int).
#
#   *** HIGHEST total wins *** — the OPPOSITE of MEM (lowest wins). This MUST be glasklart
#   in all copy and in the End Auction winnerIds rule (winnerIds = all players tied at the
#   HIGHEST total). Keep the two games' winner rules strictly apart.
#
#   NO budget in v1 (ponytail — a bid ceiling can be added later if play demands it).
#
#   SHARED WIN on the winning bid: every player whose bid equals winningBid wins and gets
#   the full winnerProfit (no tiebreak). winnerIds is a Guid[] (empty if all overbid). A
#   free event-sourcing property; the winners are read straight off the folded bids.
#
# ASSUMPTION: lot content (description, unit, the hidden trueWorth) is snapshotted onto
# Game / AuctionOpened (lots: Lot[]). OpenAuction resolves the chosen pack via a
# GameContext dependency (same pattern that mints gameId/joinCode/openedAt) and stamps the
# full lot set, so read models read events only. Lot card reads the description/unit by
# index from folded state; totalLots = lots.Count. The lot carries NO precomputed result —
# winner/pricePaid/profit are derived by the decider at RevealLot from the bids + trueWorth.
#
# Prop types (these annotations ARE the intended C# types; see specs/CLAUDE.md):
#   ids                    Guid          (gameId, playerId, hostPlayerId, joinCode;
#                                         Guid[] for *PlayerIds and winnerIds — the per-lot
#                                         winnerIds (shared winning bid) AND the End Auction
#                                         winnerIds (tied HIGHEST totals) both share the win)
#   pack ids               string        (packId — a filename slug, e.g. "blindbudet"; the
#                                         file-based CSV catalog keys packs by slug, not Guid)
#   timestamps (*At)       DateTimeOffset
#   bids & worths          decimal       (amount, trueWorth, pricePaid — real magnitudes,
#                                         exact author figures, clean sv-SE display; amount >= 0)
#   points/scores          int           (profit is 0-100 or a flat 10 for an exact bid —
#                                         % of the lot's own trueWorth, NEVER negative
#                                         (overbid = 0); totalScore = sum of profits)
#   index/count            int           (lotIndex, totalLots, resolvedLotCount)
#   per-player State maps   IReadOnlyDictionary<Guid, T>  (each LotRound's bids and profits)
#     The folded decision model keys per-player data by playerId for O(1) lookup, so these
#     State props are maps (a deliberate deviation from the constitution's collection rule for
#     the keyed decision model — same as MEM). Wire EVENTS stay flat with an explicit playerId
#     (BidPlaced, RoundScored); only the folded State is keyed.

slices:

  # --- Catalog / Setup -----------------------------------------------------

  # ASSUMPTION: the Auction catalog is reference data, not on the Game stream. Choosing to
  # play Blindbudet = choosing a lot pack (a deck of lots, each a description + hidden
  # trueWorth + unit). Same file-based CSV store as MEM: one pack = one *.csv whose filename
  # slug is the packId. Author edits in Excel / Google Sheets (sv-SE ';'-separated,
  # ','-decimal); headers beskrivning;santVärde;tema;enhet -> Lot { description, trueWorth,
  # unit }. Reuses the QuestionPackCsvParser pattern + tools/pack.cs convention. See
  # specs/CLAUDE.md.
  👀 Auction Catalog:
    - v: Pack catalog
      props:
        packs: AuctionPack[]   # { packId: string (slug), name: string, lotCount: int }

  # OpenAuction resolves {packId} to a pack via a GameContext dependency (same pattern that
  # stamps gameId/joinCode/openedAt) and snapshots the lot set onto AuctionOpened. The host is
  # the first player (hostPlayerId), so an auction is never empty. x: AuctionPackNotFound when
  # the slug resolves to no pack.
  #
  # ASSUMPTION: a "mini"-slug pack is a large concept-scale pool (175 lots) sampled down to a
  # short round of Decider.MiniAuctionSize (7) lots at open — mirrors MEM's MiniGameSize
  # marker. Non-"mini" packs play in full (no prod-size auction deck exists yet). Lots carry no
  # difference/direction, so sampling is a plain shuffle + take (no MEM band-balancing).
  #
  # Test fixtures (referenced by name in the cases below):
  #   pack blindbudet = [ lot0, lot1 ]  (the default deck)
  #   lot0 = Lot { description: lot0, trueWorth: 100, unit: lot0U }
  #   lot1 = Lot { description: lot1, trueWorth: 50,  unit: lot1U }
  #   host hostName = Martin ; minted joinCode = joinCode
  ✍️ Open Auction:
    steps:
      - t: 🧑‍🏫 host /Auction catalog
      - c: OpenAuction
        props:
          hostName: string
          packId: string          # filename slug of the chosen lot pack (e.g. blindbudet)
      - x: AuctionPackNotFound
      - e: Game / AuctionOpened
        props:
          gameId: Guid
          hostPlayerId: Guid
          hostName: string        # the host is the first player; their name lives here (never goes through JoinAuction)
          joinCode: Guid
          packId: string          # slug of the chosen pack (audit reference)
          lots: Lot[]             # { description: string, trueWorth: decimal, unit: string } — hidden worth; no precomputed result
          openedAt: DateTimeOffset
      - v: Roster
    tests:
      auction can be created:
        given: []
        when:
          - c: OpenAuction
            props: { hostName: Martin, packId: blindbudet }
        then:
          - e: Game / AuctionOpened
            props:
              hostPlayerId: minted
              hostName: Martin
              joinCode: minted
              packId: blindbudet
              lots: [lot0, lot1]
              openedAt: openedAt
      cannot open auction with unknown pack:
        given: []
        when:
          - c: OpenAuction
            props: { packId: unknown }
        then:
          - x: AuctionPackNotFound

  👀 Auction Lobby:
    steps:
      - v: Roster
        props:
          gameId: Guid
          joinCode: Guid
          players: Player[]   # { playerId: Guid, name: string, isHost: bool }
    # Projection GT: given prior Game-stream events, then the view. The host is the first
    # player (from AuctionOpened.hostName); each PlayerJoined appends another.
    tests:
      lobby lists the host and joined players:
        given:
          - e: Game / AuctionOpened
            props: { hostPlayerId: martinId, hostName: Martin, joinCode: joinCode, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
        then:
          - v: Roster
            props:
              joinCode: joinCode
              players: [hostMartin, playerNils]

  # JoinAuction keys on the minted joinCode from AuctionOpened. A joined player is identified
  # downstream by the playerId minted on PlayerJoined; the join form only carries
  # {joinCode, playerName}. Failures are Result failure-track values (see docs/adr/006):
  #   x: AuctionNotFound        — joinCode resolves to no open auction (empty/unknown stream).
  #   x: AuctionAlreadyStarted  — the auction has started; the lobby no longer accepts joins.
  #   x: NameAlreadyTaken       — a name already present (incl. the host's, the first player).
  ✍️ Join Auction:
    steps:
      - t: 🧑‍🎓 Player /Join form
      - c: JoinAuction
        props:
          joinCode: Guid
          playerName: string
      - x: AuctionNotFound
      - x: AuctionAlreadyStarted
      - x: NameAlreadyTaken
      - e: Game / PlayerJoined
        props:
          gameId: Guid
          playerId: Guid
          playerName: string
          joinedAt: DateTimeOffset
      - v: Roster
    tests:
      player can join lobby:
        given:
          - v: State / Game
            props:
              phase: lobby
              joinCode: joinCode
              players: [hostMartin]
        when:
          - c: JoinAuction
            props: { joinCode: joinCode, playerName: Nils }
        then:
          - e: Game / PlayerJoined
            props: { playerId: minted, playerName: Nils, joinedAt: joinedAt }
      cannot join nonexistent auction:
        given: []
        when:
          - c: JoinAuction
            props: { joinCode: unknown, playerName: Nils }
        then:
          - x: AuctionNotFound
      cannot join started auction:
        given:
          - v: State / Game
            props:
              phase: started
              joinCode: joinCode
              players: [hostMartin, playerNils]
        when:
          - c: JoinAuction
            props: { joinCode: joinCode, playerName: Sven }
        then:
          - x: AuctionAlreadyStarted
      cannot join with name already taken:
        given:
          - v: State / Game
            props:
              phase: lobby
              joinCode: joinCode
              players: [hostMartin, playerNils]
        when:
          - c: JoinAuction
            props: { joinCode: joinCode, playerName: Nils }
        then:
          - x: NameAlreadyTaken

  # --- Play ----------------------------------------------------------------

  # StartAuction presents the first lot by index; the Lot read-model resolves content from
  # the pack. No LotPresented event (aligns to the C# domain).
  #   x: AuctionNotFound    — gameId resolves to no open auction (empty/unknown stream).
  #   x: NotEnoughPlayers   — at least 2 players (host + >=1 join) are required to start.
  ✍️ Start Auction:
    steps:
      - t: 🧑‍🏫 host /Auction lobby
      - c: StartAuction
        props:
          gameId: Guid
      - x: AuctionNotFound
      - x: NotEnoughPlayers
      - e: Game / AuctionStarted
        props:
          gameId: Guid
          firstLotIndex: int
          startedAt: DateTimeOffset
      - v: Lot card
    tests:
      auction can be started:
        given:
          - v: State / Game
            props:
              phase: lobby
              players: [hostMartin, playerNils]
        when:
          - c: StartAuction
            props: { gameId: gameId }
        then:
          - e: Game / AuctionStarted
            props: { firstLotIndex: 0, startedAt: startedAt }
      cannot start nonexistent auction:
        given: []
        when:
          - c: StartAuction
            props: { gameId: unknown }
        then:
          - x: AuctionNotFound
      cannot start without enough players:
        given:
          - v: State / Game
            props:
              phase: lobby
              players: [hostMartin]
        when:
          - c: StartAuction
            props: { gameId: gameId }
        then:
          - x: NotEnoughPlayers

  👀 Lot:
    steps:
      - v: Lot card
        props:
          gameId: Guid
          lotIndex: int
          totalLots: int
          description: string
          unit: string
    # Projection GT: given the deck loaded + auction started, then the current lot resolved by
    # index from the folded lots. totalLots = the deck count; the hidden trueWorth is NOT
    # shown — only at reveal.
    tests:
      current lot presented with content and progress:
        given:
          - e: Game / AuctionOpened
            props: { hostPlayerId: martinId, hostName: Martin, lots: [lot0, lot1] }
          - e: Game / AuctionStarted
            props: { firstLotIndex: 0 }
        then:
          - v: Lot card
            props:
              lotIndex: 0
              totalLots: 2
              description: lot0
              unit: lot0U

  # --- Bidding -------------------------------------------------------------

  # The host also plays: Martin (id0) bids through this same Player / slice, like Nils (id1)
  # and Sven (id2). Each player places ONE hidden bid per lot. Failures are Result
  # failure-track values (see docs/adr/006), never thrown:
  #   x: AuctionNotFound     — gameId resolves to no auction (empty/unknown stream).
  #   x: BidNegative         — the raw bid amount is negative (< 0). There is NO upper bound
  #                            in v1 (no budget) — an overbid is allowed and may go negative.
  #   x: AlreadyBid          — this player already bid on this lot.
  #   x: LotAlreadyResolved  — this lot is already revealed/scored; bidding is closed.
  # PlaceBid carries lotIndex; BidPlaced stamps it back.
  ✍️ Place Bid:
    steps:
      - t: 🧑‍🎓 Player /Lot
      - c: PlaceBid
        props:
          gameId: Guid
          playerId: Guid
          lotIndex: int
          amount: decimal          # the player's hidden bid in the lot's unit, >= 0
      - x: AuctionNotFound
      - x: BidNegative
      - x: AlreadyBid
      - x: LotAlreadyResolved
      - e: Game / BidPlaced
        props:
          gameId: Guid
          playerId: Guid
          lotIndex: int
          amount: decimal
          bidAt: DateTimeOffset
      - v: Bid progress
    # Decider-true GWT: given the folded State / Game props `decide` reads — the current lot's
    # bids (AlreadyBid), resolved flag (LotAlreadyResolved) — when PlaceBid, then BidPlaced |
    # rejection. AuctionNotFound = empty stream.
    tests:
      bid placed successfully:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0Fresh]
        when:
          - c: PlaceBid
            props: { gameId: gameId, playerId: nilsId, lotIndex: 0, amount: 90 }
        then:
          - e: Game / BidPlaced
            props: { playerId: nilsId, lotIndex: 0, amount: 90, bidAt: bidAt }
      cannot bid in nonexistent auction:
        given: []
        when:
          - c: PlaceBid
            props: { gameId: unknown, playerId: nilsId, lotIndex: 0, amount: 90 }
        then:
          - x: AuctionNotFound
      negative bid rejected:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0Fresh]
        when:
          - c: PlaceBid
            props: { gameId: gameId, playerId: nilsId, lotIndex: 0, amount: -5 }   # < 0 rejected; an overbid (too LARGE) is allowed and may go negative at score
        then:
          - x: BidNegative
      cannot bid twice on same lot:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0Nils50]
        when:
          - c: PlaceBid
            props: { gameId: gameId, playerId: nilsId, lotIndex: 0, amount: 70 }
        then:
          - x: AlreadyBid
      cannot bid on an already-resolved lot:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0Resolved]
        when:
          - c: PlaceBid
            props: { gameId: gameId, playerId: martinId, lotIndex: 0, amount: 80 }
        then:
          - x: LotAlreadyResolved

  👀 Waiting For Bids:
    steps:
      - v: Bid progress
        props:
          gameId: Guid
          lotIndex: int
          submittedPlayerIds: Guid[]
          pendingPlayerIds: Guid[]
    # Projection GT: given the current lot received one bid, then the screen splits players
    # into who has bid vs who is still pending (derived from the lot's bids keys).
    tests:
      shows who has bid and who is still pending:
        given:
          - e: Game / AuctionOpened
            props: { hostPlayerId: martinId, hostName: Martin, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
          - e: Game / BidPlaced
            props: { playerId: martinId, lotIndex: 0, amount: 70 }
        then:
          - v: Bid progress
            props:
              lotIndex: 0
              submittedPlayerIds: [martinId]
              pendingPlayerIds: [nilsId]

  # --- Reveal & scoring (System processor) ---------------------------------

  # Minimal Todo read-model the reveal gear gates on. Renders the deck as a real todo list:
  # ONE row per lot. Co-located play means only the CURRENT lot receives input, so the row
  # that flips to "all in" is always the current one.
  #   Outstanding Bids gates ⚙️ System / Reveal lot:
  #   { lotIndex, pendingPlayerIds, allBidsIn }. Each BidPlaced checks off that player;
  #   allBidsIn = that row's pendingPlayerIds empty.
  📋 Outstanding Bids:
    steps:
      - v: Todo / Outstanding bids
        props:
          gameId: Guid
          lots: OutstandingBid[]   # one row per lot; OutstandingBid = { lotIndex: int, pendingPlayerIds: Guid[], allBidsIn: bool }
    tests:
      every lot opens for every player when the auction starts:
        given:
          - e: Game / AuctionOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
        then:
          - v: Todo / Outstanding bids
            props:
              lots: [ob0AllPending, ob1AllPending]
      a placed bid checks off that player on its lot:
        given:
          - e: Game / AuctionOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
          - e: Game / BidPlaced
            props: { playerId: martinId, lotIndex: 0, amount: 70 }
        then:
          - v: Todo / Outstanding bids
            props:
              lots: [ob0NilsPending, ob1AllPending]
      a lot shows all bids in once every player has bid:
        given:
          - e: Game / AuctionOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
          - e: Game / BidPlaced
            props: { playerId: martinId, lotIndex: 0, amount: 70 }
          - e: Game / BidPlaced
            props: { playerId: nilsId, lotIndex: 0, amount: 90 }
        then:
          - v: Todo / Outstanding bids
            props:
              lots: [ob0AllIn, ob1AllPending]

  # The reveal processor: once Outstanding bids shows allBidsIn, the System reveals the lot.
  # PURE 0-100 resolver: OVERBID (bid > trueWorth) is disqualified (0 points, ✗, never a
  # winner). Among validBids (≤ trueWorth) the highest is the winningBid; ALL players on it
  # SHARE the win (winnerIds, no tiebreak). winnerProfit = winningBid == trueWorth ? 10 (exact)
  # : round((trueWorth - winningBid)/trueWorth*100) — 0-100, NEVER negative (% of the lot's own
  # worth so magnitudes score comparably). Non-winners score 0. If ALL players overbid there is
  # no winner (winnerIds empty, pricePaid 0, everyone 0). Emits one LotRevealed (once) plus one
  # RoundScored per player.
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: NotAllBidsIn        — a player is still pending this lot.
  #   x: LotAlreadyResolved  — already revealed (guards a double fire).
  # 'highest total wins' is winner determination and lives on End Auction, not here.
  # Fixtures: lot0 trueWorth 100, lot1 trueWorth 50; host = martinId, Nils = nilsId.
  ✍️ Reveal Lot:
    steps:
      - e: Game / BidPlaced
      - v: Todo / Outstanding bids
      - t: ⚙️ System / Reveal lot
      - c: RevealLot
        props:
          gameId: Guid
          lotIndex: int
      - x: NotAllBidsIn
      - x: LotAlreadyResolved
      - e: Game / LotRevealed
        props:
          gameId: Guid
          lotIndex: int
          trueWorth: decimal                  # from the folded lot card
          winnerIds: Guid[]                    # all players on the winning bid (empty if all overbid)
          pricePaid: decimal                   # = the winning bid (0 if no winner)
      - e: Game / RoundScored       # one per player
        props:
          gameId: Guid
          lotIndex: int
          playerId: Guid
          profit: int                          # winner ? (winningBid == trueWorth ? 10 : round((trueWorth - winningBid)/trueWorth*100)) : 0
          totalScore: int                      # running sum over resolved lots (signed)
      - v: Round scores
    # Decider-true GWT: given the folded State / Game, when RevealLot, then the events |
    # rejection. allBidsIn is DERIVED: players == the current lot's bids keys. totalScore is the
    # running sum of profits across resolved lots.
    tests:
      highest bid wins and pays its bid:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0BothIn, lot1Fresh]   # both in -> allBidsIn derived true
        when:
          - c: RevealLot
            props: { gameId: gameId, lotIndex: 0 }
        then:
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [nilsId], pricePaid: 90 }
          - e: Game / RoundScored
            props: { playerId: martinId, profit: 0, totalScore: 0 }
          - e: Game / RoundScored
            props: { playerId: nilsId, profit: 10, totalScore: 10 }   # 100 - 90
      overbidding excludes from winning, never negative:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0MartinOverbid, lot1Fresh]   # martin overbids the worth (100) -> disqualified
        when:
          - c: RevealLot
            props: { gameId: gameId, lotIndex: 0 }
        then:
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [nilsId], pricePaid: 80 }   # nils is the highest valid bid
          - e: Game / RoundScored
            props: { playerId: martinId, profit: 0, totalScore: 0 }   # overbid -> disqualified, 0, never negative
          - e: Game / RoundScored
            props: { playerId: nilsId, profit: 20, totalScore: 20 }   # (100-80)/100*100
      tie on the winning bid is shared:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0Tied80, lot1Fresh]   # equal top valid bids -> shared win
        when:
          - c: RevealLot
            props: { gameId: gameId, lotIndex: 0 }
        then:
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [martinId, nilsId], pricePaid: 80 }   # both share
          - e: Game / RoundScored
            props: { playerId: martinId, profit: 20, totalScore: 20 }
          - e: Game / RoundScored
            props: { playerId: nilsId, profit: 20, totalScore: 20 }
      exact guess scores ten for all:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0Exact100, lot1Fresh]   # both hit the worth exactly
        when:
          - c: RevealLot
            props: { gameId: gameId, lotIndex: 0 }
        then:
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [martinId, nilsId], pricePaid: 100 }
          - e: Game / RoundScored
            props: { playerId: martinId, profit: 10, totalScore: 10 }   # exact -> flat 10
          - e: Game / RoundScored
            props: { playerId: nilsId, profit: 10, totalScore: 10 }
      all overbid yields no winner:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0AllOverbid, lot1Fresh]   # everyone overbids the worth (100)
        when:
          - c: RevealLot
            props: { gameId: gameId, lotIndex: 0 }
        then:
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [], pricePaid: 0 }   # no valid bid -> no winner
          - e: Game / RoundScored
            props: { playerId: martinId, profit: 0, totalScore: 0 }
          - e: Game / RoundScored
            props: { playerId: nilsId, profit: 0, totalScore: 0 }
      scores accumulate across lots:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 1
              players: [hostMartin, playerNils]
              # lot0 already resolved -> its profits are the source of the running total
              lots: [lot0Scored, lot1BothIn]
        when:
          - c: RevealLot
            props: { gameId: gameId, lotIndex: 1 }
        then:
          - e: Game / LotRevealed
            props: { lotIndex: 1, trueWorth: 50, winnerIds: [martinId], pricePaid: 40 }
          - e: Game / RoundScored
            props: { playerId: martinId, profit: 20, totalScore: 20 }   # (50-40)/50*100 = 20; running 0 + 20
          - e: Game / RoundScored
            props: { playerId: nilsId, profit: 0, totalScore: 10 }       # running 10 + 0
      cannot reveal before all bids in:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0MartinOnly, lot1Fresh]   # nilsId missing -> allBidsIn derived false
        when:
          - c: RevealLot
            props: { gameId: gameId, lotIndex: 0 }
        then:
          - x: NotAllBidsIn
      cannot reveal an already-resolved lot:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              players: [hostMartin, playerNils]
              lots: [lot0Resolved, lot1Fresh]   # already resolved (bids folded in) -> double fire guarded
        when:
          - c: RevealLot
            props: { gameId: gameId, lotIndex: 0 }
        then:
          - x: LotAlreadyResolved

  👀 Round Results:
    steps:
      - v: Round scores
        props:
          gameId: Guid
          lotIndex: int
          trueWorth: decimal              # from LotRevealed
          winnerIds: Guid[]                # from LotRevealed
          pricePaid: decimal               # from LotRevealed
          playerProfits: PlayerProfit[]    # { playerId: Guid, profit: int, totalScore: int } from per-player RoundScored
    # Projection GT: given the lot revealed (reveal + one RoundScored per player), then the
    # results screen shows the revealed worth, winner, price paid and each player's profit +
    # running total.
    tests:
      reveals the worth, winner and per-player profit once resolved:
        given:
          - e: Game / AuctionOpened
            props: { hostPlayerId: martinId, hostName: Martin, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
          - e: Game / BidPlaced
            props: { playerId: martinId, lotIndex: 0, amount: 70 }
          - e: Game / BidPlaced
            props: { playerId: nilsId, lotIndex: 0, amount: 90 }
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [nilsId], pricePaid: 90 }
          - e: Game / RoundScored
            props: { lotIndex: 0, playerId: martinId, profit: 0, totalScore: 0 }
          - e: Game / RoundScored
            props: { lotIndex: 0, playerId: nilsId, profit: 10, totalScore: 10 }
        then:
          - v: Round scores
            props:
              lotIndex: 0
              trueWorth: 100
              winnerIds: [nilsId]
              pricePaid: 90
              playerProfits: [ppMartin0, ppNils10]

  # --- Progression (System processor) --------------------------------------

  # Minimal Todo read-model the progression processors gate on. The whole deck is on the
  # stream (AuctionOpened carries lots), so totalLots = lots.Count and resolvedLotCount /
  # hasNextLot are projected as each lot is resolved. hasNextLot is the gate: true ->
  # ⚙️ Next lot, false -> ⚙️ End auction (mutually exclusive). SEPARATE from State / Game.
  📋 Auction Progress:
    steps:
      - v: Todo / Auction progress
        props:
          gameId: Guid
          lotIndex: int
          totalLots: int
          resolvedLotCount: int
          hasNextLot: bool
    tests:
      progress shows a next lot while lots remain:
        given:
          - e: Game / AuctionOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [nilsId], pricePaid: 90 }
        then:
          - v: Todo / Auction progress
            props: { lotIndex: 0, totalLots: 2, resolvedLotCount: 1, hasNextLot: true }
      progress shows no next lot once the last is resolved:
        given:
          - e: Game / AuctionOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [nilsId], pricePaid: 90 }
          - e: Game / NextLotStarted
            props: { lotIndex: 1 }
          - e: Game / LotRevealed
            props: { lotIndex: 1, trueWorth: 50, winnerIds: [martinId], pricePaid: 40 }
        then:
          - v: Todo / Auction progress
            props: { lotIndex: 1, totalLots: 2, resolvedLotCount: 2, hasNextLot: false }

  # Fires when Auction progress shows hasNextLot. Presents the next lot by index.
  ✍️ Next Lot:
    steps:
      - e: Game / LotRevealed
      - v: Todo / Auction progress
      - t: ⚙️ System / Next lot
      - c: AskNextLot
        props:
          gameId: Guid
      - e: Game / NextLotStarted
        props:
          gameId: Guid
          lotIndex: int
      - v: Lot card
    # Decider-true GWT: given the folded State / Game (current lot resolved, another remains —
    # hasNextLot derived true), when AskNextLot, then NextLotStarted at the next index. The gate
    # is verified by Auction progress' GT.
    tests:
      next lot presented when one remains:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0
              lots: [lot0Scored, lot1Fresh]
        when:
          - c: AskNextLot
            props: { gameId: gameId }
        then:
          - e: Game / NextLotStarted
            props: { lotIndex: 1 }

  # --- End (System processor) ----------------------------------------------

  # Fires when Auction progress shows NOT hasNextLot (mutually exclusive with Next Lot; both
  # react to LotRevealed and the gate decides which fires). Computes the final scoreboard from
  # each player's DERIVED totalScore; winnerIds = ALL players tied at the HIGHEST total
  # (HIGHEST wins — the OPPOSITE of MEM; ties share the win).
  ✍️ End Auction:
    steps:
      - e: Game / LotRevealed
      - v: Todo / Auction progress
      - t: ⚙️ System / End auction
      - c: EndAuction
        props:
          gameId: Guid
      - e: Game / AuctionEnded
        props:
          gameId: Guid
          finalScoreboard: ScoreboardEntry[]   # { playerId: Guid, playerName: string, totalScore: int }
          winnerIds: Guid[]                     # all players tied at the HIGHEST total
          endedAt: DateTimeOffset
      - v: Scoreboard
    # Decider-true GWT: given the folded State / Game (all lots resolved, none left -> hasNextLot
    # derived false), when EndAuction, then AuctionEnded with the scoreboard and the
    # HIGHEST-total winner(s). No x: — the hasNextLot gate makes End Auction / Next Lot mutually
    # exclusive and each fires once per LotRevealed.
    tests:
      highest score wins:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 1
              players: [hostMartin, playerNils]
              lots: [lot0Profits20And0, lot1Profits0And5]
        when:
          - c: EndAuction
            props: { gameId: gameId }
        then:
          - e: Game / AuctionEnded
            props:
              finalScoreboard: [sbMartin20, sbNils5]
              winnerIds: [martinId]   # martin highest total (20 > 5)
              endedAt: endedAt
      tied highest totals share the win:
        given:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 1
              players: [hostMartin, playerNils]
              lots: [lot0Profits10Each, lot1Profits5Each]
        when:
          - c: EndAuction
            props: { gameId: gameId }
        then:
          - e: Game / AuctionEnded
            props:
              finalScoreboard: [sbMartin15, sbNils15]
              winnerIds: [martinId, nilsId]   # equal highest total -> shared win
              endedAt: endedAt

  👀 Final Standings:
    steps:
      - v: Scoreboard
        props:
          gameId: Guid
          finalScoreboard: ScoreboardEntry[]   # { playerId: Guid, playerName: string, totalScore: int }
          winnerIds: Guid[]   # all players tied at the HIGHEST total
    # Projection GT: AuctionEnded already carries the computed scoreboard + winnerIds (HIGHEST
    # total wins; ties share), so the final screen projects them straight through.
    tests:
      shows the final scoreboard and winner:
        given:
          - e: Game / AuctionEnded
            props:
              finalScoreboard: [sbMartin20, sbNils5]
              winnerIds: [martinId]
              endedAt: endedAt
        then:
          - v: Scoreboard
            props:
              finalScoreboard: [sbMartin20, sbNils5]
              winnerIds: [martinId]

  # --- Decision model (decider State) — APPENDIX, not a timeline step ------

  # Placed LAST on purpose: the slices above read top-to-bottom as the story
  # (catalog -> lobby -> join -> start -> bid -> reveal -> next -> end). This box is NOT a
  # moment in that timeline — it is the folded AuctionState the decider's `decide` reads,
  # referenced by the Given of every command/processor slice above. State / Game is the SINGLE
  # decision model (one Decider per auction, one State). emlang has no `state` element, so every
  # command/processor slice expresses its Given as this view. A GWT case asserts only the props
  # its `decide` actually reads. This box is distinct from the minimal Todo / read-models the
  # System processors gate on — an event feeds both.
  #
  # The auction loads the WHOLE deck up front (lots: LotRound[]) and players' bids fold into
  # each lot as they arrive — one cohesive structure. A LotRound is the immutable lot card plus
  # how it is being bid on. Progress/pending/totals are DERIVED from lots + players, so the fold
  # keeps a single source of truth and no redundant flags.
  #
  # LotRound fixtures (lot = a Lot fixture; bids/profits are maps keyed by playerId; value
  # objects never repeat the key). Tests reference rounds by fixture NAME (lot0Fresh,
  # lot0BothIn, lot0Scored, …) — the names resolve to Fixtures.* in the generated SpecTests
  # (ADR 017); the fixture definitions live in Blindbudet.Domain.Tests/Fixtures.cs. The bids
  # map holds a raw decimal amount per player, folded in event-log order.
  #
  # Player fixtures (Player = { playerId: Guid, name: string, isHost: bool }), reused by the
  # Join / Start / Bid GWTs:
  #   hostMartin = { playerId: martinId, name: Martin, isHost: true }
  #   playerNils = { playerId: nilsId,   name: Nils,   isHost: false }
  #   playerSven = { playerId: svenId,   name: Sven,   isHost: false }
  #
  # Lot fixtures:
  #   lot0 = Lot { description: lot0, trueWorth: 100, unit: lot0U }
  #   lot1 = Lot { description: lot1, trueWorth: 50,  unit: lot1U }
  👀 Decision Model:
    steps:
      - v: State / Game
        props:
          gameId: Guid
          joinCode: Guid
          phase: AuctionPhase (lobby|started|ended)
          hostPlayerId: Guid
          players: Player[]              # { playerId: Guid, name: string, isHost: bool }
          currentLotIndex: int
          lots: IReadOnlyList<LotRound>  # the fixed deck loaded up front + how each is being bid on
          # LotRound = {
          #   lot: Lot,                                       # immutable card from AuctionOpened: { description, unit: string; trueWorth: decimal } — hidden worth, no precomputed result
          #   bids: IReadOnlyDictionary<Guid, decimal>,       # this lot's hidden bids; key=playerId, value=amount; folded in event-log order
          #   trueWorth: decimal?,                            # revealed at reveal (null before) = lot.trueWorth surfaced onto the stream
          #   winnerIds: IReadOnlyList<Guid>,                 # all players on the winning bid (empty before reveal / if all overbid)
          #   pricePaid: decimal?,                            # the winning bid (null before reveal; 0 if no winner)
          #   profits: IReadOnlyDictionary<Guid, int>,        # per-player profit, set at reveal; key=playerId
          #   resolved: bool }
          # DERIVED (computed, NOT stored — single source of truth in lots + players):
          #   pendingBidPlayerIds(i)  = players.Keys − lots[i].bids.Keys
          #   allBidsIn(i)            = pendingBidPlayerIds(i) is empty
          #   currentLotResolved      = lots[currentLotIndex].resolved
          #   hasNextLot              = currentLotIndex + 1 < lots.Count
          #   totalScore(p)           = Σ over resolved lots of profits[p]
    tests:
      state folds a bid into the decision model:
        given:
          - e: Game / AuctionOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
          - e: Game / BidPlaced
            props: { playerId: martinId, lotIndex: 0, amount: 70 }
        then:
          - v: State / Game
            props:
              phase: started
              hostPlayerId: martinId
              currentLotIndex: 0
              lots: [lot0MartinOnly, lot1Fresh]   # nilsId still pending (derived)
      resolving a lot folds the reveal and profits into that lot:
        given:
          - e: Game / AuctionOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, lots: [lot0, lot1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / AuctionStarted
          - e: Game / BidPlaced
            props: { playerId: martinId, lotIndex: 0, amount: 70 }
          - e: Game / BidPlaced
            props: { playerId: nilsId, lotIndex: 0, amount: 90 }
          - e: Game / LotRevealed
            props: { lotIndex: 0, trueWorth: 100, winnerIds: [nilsId], pricePaid: 90 }
          - e: Game / RoundScored
            props: { lotIndex: 0, playerId: martinId, profit: 0, totalScore: 0 }
          - e: Game / RoundScored
            props: { lotIndex: 0, playerId: nilsId, profit: 10, totalScore: 10 }
        then:
          - v: State / Game
            props:
              phase: started
              currentLotIndex: 0   # resolving does not advance; AskNextLot does
              # lot0 fully resolved: reveal + per-player profits folded in
              # (totalScore is DERIVED by summing profits across resolved lots: martin 0, nils 10)
              lots: [lot0ResolvedFull, lot1Fresh]
