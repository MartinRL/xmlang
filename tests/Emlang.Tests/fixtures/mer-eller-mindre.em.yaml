# Mer eller Mindre — Event-Modeling spec for one round ("omgång").
# Transcribed from specs/MEM-omgång.png. See specs/CLAUDE.md for conventions.
#
# Conventions:
#   triggers carry the actor role + originating screen
#                                  (host / Quiz catalog, Player / Question, System / ...)
#   commands are bare              (OpenLobby, SubmitDirection)
#   events carry the stream        (Game / LobbyOpened)
#   exceptions are bare            (GameNotFound)
#   screen views are bare data nouns; State/Todo views carry a lane
#                                  (Roster, Todo / Outstanding directions)
#
# View lanes:
#   State / ...   the decider's decision model (folded GameState); read by `decide`
#   Todo / ...    processor-facing read-models the System observes (never shown)
#   bare noun     human screens, named for the DATA they carry (Roster, Round scores)
# NOTE: emlang parses + lints these view-lane prefixes fine, but the diagram renders
#   views by their bare name without a per-view lane label (only triggers and events
#   get a visible swimlane label). The prefix still documents intent and maps to code.
#
# Verification is decider-true (see docs/adr/decider-pattern.svg):
#   Given -> state (prior events folded via evolve)   When -> command   Then -> events|x
# emlang has no `state` element, so the decider's Given is expressed as a VIEW:
# State / Game, the single folded decision model (one Decider per game, one State).
# Every command/processor slice references `State / Game` in `given:`, asserting only
# the props that case relies on. GWT given:s never replay events — that is what the
# State / Game / Todo / Screen view-slices' own GT (prior events -> view) verify.
#
# Automations are the Event-Modeling PROCESSOR pattern, not a dedicated element
# (emlang has no cog/gear): event(s) -> Todo read-model -> System trigger -> command
# -> event(s) -> Screen. The Todo read-model is MINIMAL (only what the gear needs to
# see a task exists) and SEPARATE from State / Game — an event feeds many green boxes;
# the decision model is never reused as a todo list. "All directions/differences in" is
# therefore a CONDITION of a todo read-model (Todo / Outstanding ...), not an event. The game
# is co-located (one room, like a board game) so automations fire on a STATE CONDITION,
# never a clock — there are NO timeouts and no Passage-of-Time slices (a documented
# future possibility only).
#
# Scoring — the TWÅSTEGSRAKET (two-stage rocket). A question is answered in two stages,
# each its own command/reveal/score pair, but the per-player roundScore folds to the same
# total as the old one-shot model:
#   roundScore = |guessedDifferenceNormalized - correctDifference| + (directionCorrect ? -10 : 0)
#   lowest total score wins; negative scores possible (exact difference + right
#   direction = -10, the best possible round).
#
#   STAGE 1 (riktning): everyone answers mer/mindre only (SubmitDirection). Once every
#   player is in, the System reveals the correct direction (RevealDirection ->
#   QuestionDirectionRevealed) and deals the -10 bonus in a mellansteg of its own — one
#   Game / DirectionScored per player (bonusPoints = directionCorrect ? -10 : 0). The
#   reveal + the bonus drama is the whole point of splitting the rocket.
#
#   STAGE 2 (skillnad): everyone then guesses the magnitude (SubmitDifference), exactly
#   as before — regardless of whether their direction was right. The PRESENTATION is
#   0-100-framed: "om den större är 100, var hamnar den mindre?" (a 0-100 placement).
#   The wire contract is unchanged: the slider is raw under the hood, so SubmitDifference
#   still carries the RAW absolute difference in the card's own unit and the SYSTEM
#   normalizes server-side. The client never sees the hidden values, so it cannot
#   normalize: SubmitDifference carries the RAW guessedDifference and ScoreDifference
#   (which holds the card) does the maths. With mx = max(valueA, valueB):
#     correctDifference           = round(|valueA - valueB| / mx * 100)          (0-100, byte)
#     guessedDifferenceNormalized = min(100, round(guessedDifference / mx * 100)) (0-100, byte, CLAMPED)
#   Same mx for guess and answer, so both land on one scale. A wildly-too-large raw guess
#   is clamped at 100 (no overshoot); a negative raw guess is rejected up front
#   (DifferenceOutOfRange). There is NO upper bound on the raw guess itself.
#
#   The question card stores the two RAW absolute values (valueA, valueB; decimal) —
#   never a 0-100 number — so the author just types the real figures, no mental
#   arithmetic. ScoreDifference balances them onto 0-100: it reveals correctDifference;
#   correctDirection was already revealed in stage 1. Picture the two values as two bars
#   side by side; correctDifference is how much taller the tall bar is, as a share of the
#   tall bar itself:
#     equal bars            -> 0
#     short bar = half tall -> 50
#     short bar = a tenth   -> 90
#     short bar ~ nothing   -> near 100
#   This deliberately compresses large ratios (2x->50, 10x->90, 100x->99): small
#   differences are the fun ones to pin down, giant ones are obviously giant.
#   Simplicity is the guiding star. For quantities already measured on a multiplicative
#   scale (decibel, Richter, pH), those scale values are themselves what gets balanced.
#
#   The roundScore is split across the two stages but folds to the same total: the -10
#   bonus lands on Game / DirectionScored (stage 1); the difference points + the combined
#   roundScore land on Game / DifferenceScored (stage 2). So
#   DifferenceScored.roundScore = differencePoints + (stage-1 bonus) and its totalScore is
#   the running sum. correctDirection is revealed once per question on
#   Game / QuestionDirectionRevealed (stage 1); correctDifference once on
#   Game / QuestionDifferenceRevealed (stage 2, the progression gate).
#
# ASSUMPTION: question-card content (text, item labels, the unit, and the two RAW values
# valueA/valueB) is snapshotted onto Game / LobbyOpened (questions: Question[]).
# OpenLobby resolves the chosen pack via a GameContext dependency and stamps the full
# question set, so read models read events only. Question card reads card
# text/labels by index from folded state; totalQuestions = questions.Count. The card
# carries NO precomputed answer — the per-question reveal (correctDirection/normalized
# correctDifference) is derived by the decider from valueA/valueB in that state.
#
# Prop types (these annotations ARE the intended C# types; see specs/CLAUDE.md):
#   ids                    Guid          (gameId, playerId, hostPlayerId,
#                                         joinCode; Guid[] for
#                                         *PlayerIds and winnerIds — tied lowest totals share the win)
#   pack ids               string        (questionPackId, packId — a filename slug, e.g.
#                                         "mer-eller-mindre"; the file-based CSV catalog
#                                         keys packs by slug, not Guid — see specs/CLAUDE.md)
#   timestamps (*At)       DateTimeOffset
#   direction              Direction (mer|mindre)  — enum
#   raw guessed difference decimal       (guessedDifference — the player's RAW absolute
#                                         guess in the card's unit, >= 0; NOT 0-100)
#   normalized difference  byte (0-100)  (correctDifference and guessedDifferenceNormalized,
#                                         both DERIVED by ScoreQuestion; never on the card)
#   difference points      byte (0-100)  (differencePoints — non-negative gap |norm - correct|)
#   raw card values        decimal       (valueA, valueB — real magnitudes, any unit;
#                                         exact author figures, clean sv-SE display)
#   points/scores          int           (bonusPoints, roundScore, totalScore — signed,
#                                         may be negative per scoring rule)
#   index/count            int
#   per-player State maps   IReadOnlyDictionary<Guid, T>  (each QuestionRound's
#                                                          directions, directionScores,
#                                                          differences and roundScores)
#     The folded decision model keys per-player data by playerId for O(1) lookup, so
#     these State props are maps, NOT IReadOnlyList<T> (a deliberate deviation from the
#     constitution's collection rule for the keyed decision model). The value objects
#     (Direction, int, decimal) NEVER repeat the key. Wire EVENTS stay flat with an
#     explicit playerId (DirectionSubmitted, DirectionScored, DifferenceSubmitted,
#     DifferenceScored); only the folded State is keyed.

slices:

  # --- Catalog / Setup -----------------------------------------------------

  # ASSUMPTION: the Quiz catalog is reference data, not on the Game stream.
  # Choosing to play MEM = choosing a question pack (a deck of designated
  # question-cards, e.g. "0-100"). Pack publishing/commerce is out of scope.
  # The catalog is a file-based CSV store: one pack = one *.csv whose filename slug is
  # the packId/questionPackId. The packs are domain reference data, kept in the Domain
  # project (src/MerEllerMindre.Domain/data/packs) and copied to output. The author edits
  # cards in Excel / Google Sheets (sv-SE ';'-separated, ','-decimal). See specs/CLAUDE.md.
  👀 Quiz Catalog:
    - v: Pack catalog
      props:
        packs: QuestionPack[]   # { packId: string (slug), name: string, questionCount: int } — each card also carries a differencePrompt (string)

  # OpenLobby resolves {questionPackId} to a pack via a GameContext dependency
  # (same pattern that stamps gameId/joinCode/createdAt) and snapshots a BALANCED
  # selection of N=roundCount cards onto LobbyOpened — NOT the full pack (a pack with
  # <= roundCount cards is used whole). The host picks roundCount (4-21) on the host
  # form; the default is the pack's size class (mini 7, prod 21). The host is the first
  # player (hostPlayerId), so a game is never empty. x: QuestionPackNotFound when the
  # id resolves to no pack; x: RoundCountOutOfRange when roundCount is outside 4-21.
  # ASSUMPTION: "balanced" = difficulty-band quotas from specs/question-style-guide.md
  # (band = round(|A-B|/max(A,B)*100); [0-20]/[20-60]/[60-85]/[85-100] ~ 3/9/6/3 of N),
  # shuffled order, RNG injected via GameContext.NextRandom. The N cards are frozen on
  # LobbyOpened so Evolve replays the stored deck and never re-selects.
  #
  # NOTE: any GWT issuing OpenLobby MUST carry roundCount — an omitted int prop
  # constructs as 0, which trips RoundCountOutOfRange before anything else.
  #
  # Test fixtures (referenced by name in the cases below):
  #   pack mer-eller-mindre = [ question0, question1 ]  (the default deck)
  #   question0 = Question { questionText: question0, itemA: question0A, itemB: question0B, valueA: 100, valueB: 60, unit: question0U, differencePrompt: question0D }  # reveals -> mer,    40 (mx=100)
  #   question1 = Question { questionText: question1, itemA: question1A, itemB: question1B, valueA: 80,  valueB: 100, unit: question1U, differencePrompt: question1D } # reveals -> mindre, 20 (mx=100)
  #   Both fixture cards have mx=100, so a raw guessedDifference d (0<=d<=100) normalizes
  #   to itself (guessedDifferenceNormalized = d) — the GWT numbers below read raw == normalized.
  #   host hostName = Martin ; minted joinCode = joinCode
  ✍️ Open Lobby:
    steps:
      - t: 🧑‍🏫 host /Quiz catalog
      - c: OpenLobby
        props:
          hostName: string
          questionPackId: string   # filename slug of the chosen pack (e.g. mer-eller-mindre)
          roundCount: int (4-21)   # how many questions the host chose on the host form; default = pack size class (mini 7, prod 21)
      - x: RoundCountOutOfRange
      - x: QuestionPackNotFound
      - e: Game / LobbyOpened
        props:
          gameId: Guid
          hostPlayerId: Guid
          hostName: string        # the host is the first player; their name lives here (never goes through JoinGame)
          joinCode: Guid
          questionPackId: string  # slug of the chosen pack (audit reference)
          questions: Question[]   # { questionText: string, itemA: string, itemB: string, valueA: decimal, valueB: decimal, unit: string, differencePrompt: string } — raw values; no precomputed answer
          createdAt: DateTimeOffset
      - v: Roster
    tests:
      game can be created:
        given: []
        when:
          - c: OpenLobby
            props: { hostName: Martin, questionPackId: mer-eller-mindre, roundCount: 7 }
        then:
          - e: Game / LobbyOpened
            props:
              hostPlayerId: minted
              hostName: Martin
              joinCode: minted
              questionPackId: mer-eller-mindre
              questions: [question0, question1]
              createdAt: createdAt
      cannot open lobby with unknown pack:
        given: []
        when:
          - c: OpenLobby
            props: { questionPackId: unknown, roundCount: 7 }
        then:
          - x: QuestionPackNotFound
      cannot open lobby with too few questions:
        given: []
        when:
          - c: OpenLobby
            props: { hostName: Martin, questionPackId: mer-eller-mindre, roundCount: 3 }
        then:
          - x: RoundCountOutOfRange
      cannot open lobby with too many questions:
        given: []
        when:
          - c: OpenLobby
            props: { hostName: Martin, questionPackId: mer-eller-mindre, roundCount: 22 }
        then:
          - x: RoundCountOutOfRange

  👀 Game Lobby:
    steps:
      - v: Roster
        props:
          gameId: Guid
          joinCode: Guid
          players: Player[]   # { playerId: Guid, name: string, isHost: bool }
    # Projection GT: given prior Game-stream events, then the view (verifies evolve into
    # the screen). The host is the first player (from LobbyOpened.hostName); each
    # PlayerJoined appends another. joinCode comes straight from LobbyOpened.
    tests:
      lobby lists the host and joined players:
        given:
          - e: Game / LobbyOpened
            props: { hostPlayerId: martinId, hostName: Martin, joinCode: joinCode, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
        then:
          - v: Roster
            props:
              joinCode: joinCode
              players: [hostMartin, playerNils]

  # JoinGame keys on the minted joinCode from LobbyOpened. A joined player is
  # identified downstream by the playerId minted on PlayerJoined; the join form
  # only carries {joinCode, playerName}. Failures are Result failure-track values
  # (see docs/adr/006), never thrown exceptions:
  #   x: GameNotFound        — joinCode resolves to no open game (empty/unknown stream).
  #   x: GameAlreadyStarted  — the game has started; the lobby no longer accepts joins.
  #   x: NameAlreadyTaken    — see ASSUMPTION below.
  # ASSUMPTION: duplicate joins are detected by playerName within a game (the
  #   command carries no playerId), so NameAlreadyTaken guards a name already
  #   present in the lobby — including the host's name (the host is the first player).
  ✍️ Join Game:
    steps:
      - t: 🧑‍🎓 Player /Join form
      - c: JoinGame
        props:
          joinCode: Guid
          playerName: string
      - x: GameNotFound
      - x: GameAlreadyStarted
      - x: NameAlreadyTaken
      - e: Game / PlayerJoined
        props:
          gameId: Guid
          playerId: Guid
          playerName: string
          joinedAt: DateTimeOffset
      - v: Roster
    # Decider-true GWT: given the folded State / Game props `decide` reads (phase guards
    # the lobby-open window, players guards a duplicate name), when JoinGame, then the
    # event | rejection. GameNotFound is the empty stream (no State / Game yet).
    tests:
      player can join lobby:
        given:
          - v: State / Game
            props:
              phase: lobby
              joinCode: joinCode
              players: [hostMartin]
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Nils }
        then:
          - e: Game / PlayerJoined
            props: { playerId: minted, playerName: Nils, joinedAt: joinedAt }
      cannot join nonexistent game:
        given: []
        when:
          - c: JoinGame
            props: { joinCode: unknown, playerName: Nils }
        then:
          - x: GameNotFound
      cannot join started game:
        given:
          - v: State / Game
            props:
              phase: started
              joinCode: joinCode
              players: [hostMartin, playerNils]
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Sven }
        then:
          - x: GameAlreadyStarted
      cannot join with name already taken:
        given:
          - v: State / Game
            props:
              phase: lobby
              joinCode: joinCode
              players: [hostMartin, playerNils]
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Nils }
        then:
          - x: NameAlreadyTaken

  # --- Play ----------------------------------------------------------------

  # StartGame presents Q0 by index; the Question read-model resolves card content
  # from the pack. No QuestionPresented event (aligns to the C# domain).
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: GameNotFound       — gameId resolves to no open game (empty/unknown stream).
  #   x: NotEnoughPlayers   — see ASSUMPTION below.
  # ASSUMPTION: at least 2 players (the host + >=1 join) are required to start;
  #   otherwise NotEnoughPlayers. GameAlreadyStarted is NOT guarded here (already
  #   guarded on Join Game); host-only (NotGameHost) would need requestingPlayerId
  #   on the command and is deferred.
  ✍️ Start Game:
    steps:
      - t: 🧑‍🏫 host /Game lobby
      - c: StartGame
        props:
          gameId: Guid
      - x: GameNotFound
      - x: NotEnoughPlayers
      - e: Game / GameStarted
        props:
          gameId: Guid
          firstQuestionIndex: int
          startedAt: DateTimeOffset
      - v: Question card
    # Decider-true GWT: given the folded State / Game props `decide` reads (players
    # count guards NotEnoughPlayers; phase: lobby is the start window), when StartGame,
    # then the event | rejection. GameNotFound is the empty stream (no State / Game yet).
    tests:
      game can be started:
        given:
          - v: State / Game
            props:
              phase: lobby
              players: [hostMartin, playerNils]
        when:
          - c: StartGame
            props: { gameId: gameId }
        then:
          - e: Game / GameStarted
            props: { firstQuestionIndex: 0, startedAt: startedAt }
      cannot start nonexistent game:
        given: []
        when:
          - c: StartGame
            props: { gameId: unknown }
        then:
          - x: GameNotFound
      cannot start without enough players:
        given:
          - v: State / Game
            props:
              phase: lobby
              players: [hostMartin]
        when:
          - c: StartGame
            props: { gameId: gameId }
        then:
          - x: NotEnoughPlayers

  👀 Question:
    steps:
      - v: Question card
        props:
          gameId: Guid
          questionIndex: int
          totalQuestions: int
          questionText: string
          itemA: string
          itemB: string
    # Projection GT: given the deck loaded + game started, then the current card resolved
    # by index from the folded questions. totalQuestions = the deck count; card text/items
    # are read from question0 (the raw valueA/valueB are NOT shown — only at reveal).
    tests:
      current question presented with card content and progress:
        given:
          - e: Game / LobbyOpened
            props: { hostPlayerId: martinId, hostName: Martin, questions: [question0, question1] }
          - e: Game / GameStarted
            props: { firstQuestionIndex: 0 }
        then:
          - v: Question card
            props:
              questionIndex: 0
              totalQuestions: 2
              questionText: question0
              itemA: question0A
              itemB: question0B

  # --- Stage 1: direction (mer/mindre) -------------------------------------

  # The Game Master also plays: Martin (id0) submits through this same Player / slice,
  # like Nils (id1) and Sven (id2). Stage 1 of the twåstegsraket: pick mer/mindre only —
  # the magnitude comes later (Submit Difference). Failures are Result failure-track values
  # (see docs/adr/006), never thrown:
  #   x: GameNotFound               — gameId resolves to no game (empty/unknown stream).
  #   x: GameNotStarted             — still in the lobby; no question is presented yet.
  #   x: PlayerNotInGame            — playerId never joined this game.
  #   x: AlreadySubmittedDirection  — this player already picked a direction this question.
  # NOTE: "invalid direction" is NOT modeled — direction is a typed Direction
  #   (mer|mindre) enum, so an invalid value is unrepresentable in the decider; any
  #   bad input is a web/model-binding concern in the imperative shell, not a slice.
  # The submission targets the current question by folded state, so SubmitDirection carries
  # no questionIndex; DirectionSubmitted stamps the resolved questionIndex.
  ✍️ Submit Direction:
    steps:
      - t: 🧑‍🎓 Player /Question
      - c: SubmitDirection
        props:
          gameId: Guid
          playerId: Guid
          direction: Direction (mer|mindre)
      - x: GameNotFound
      - x: GameNotStarted
      - x: PlayerNotInGame
      - x: AlreadySubmittedDirection
      - e: Game / DirectionSubmitted
        props:
          gameId: Guid
          playerId: Guid
          questionIndex: int
          direction: Direction (mer|mindre)
          submittedAt: DateTimeOffset
      - v: Guess progress
    # Decider-true GWT: given the folded State / Game props `decide` reads — phase
    # (GameNotStarted), players (PlayerNotInGame), the current question's directions
    # (AlreadySubmittedDirection) — when SubmitDirection, then DirectionSubmitted |
    # rejection. GameNotFound = empty stream.
    tests:
      direction submitted successfully:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0Fresh
        when:
          - c: SubmitDirection
            props: { gameId: gameId, playerId: nilsId, direction: mer }
        then:
          - e: Game / DirectionSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mer, submittedAt: submittedAt }
      cannot submit direction in nonexistent game:
        given: []
        when:
          - c: SubmitDirection
            props: { gameId: unknown, playerId: nilsId, direction: mer }
        then:
          - x: GameNotFound
      cannot submit direction before game starts:
        given:
          - v: State / Game
            props:
              phase: lobby
              players: [hostMartin, playerNils]
        when:
          - c: SubmitDirection
            props: { gameId: gameId, playerId: nilsId, direction: mer }
        then:
          - x: GameNotStarted
      cannot submit direction as non-member:
        given:
          - v: State / Game
            props:
              phase: started
              players: [hostMartin, playerNils]
        when:
          - c: SubmitDirection
            props: { gameId: gameId, playerId: svenId, direction: mer }
        then:
          - x: PlayerNotInGame
      cannot submit direction twice on same question:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0NilsMer
        when:
          - c: SubmitDirection
            props: { gameId: gameId, playerId: nilsId, direction: mindre }
        then:
          - x: AlreadySubmittedDirection

  # --- Stage 2: difference (the slider) ------------------------------------

  # Stage 2 of the twåstegsraket, reached only after the direction is revealed
  # (QuestionDirectionRevealed). Everyone guesses the magnitude — the RAW absolute
  # difference in the card's own unit (>= 0) — regardless of whether their direction was
  # right. Failures are Result failure-track values, never thrown:
  #   x: GameNotFound                — gameId resolves to no game (empty/unknown stream).
  #   x: GameNotStarted              — still in the lobby; no question is presented yet.
  #   x: PlayerNotInGame             — playerId never joined this game.
  #   x: DirectionNotRevealed        — stage 1 is not yet closed (cannot size before the
  #                                    direction reveal / mellansteg).
  #   x: AlreadySubmittedDifference  — this player already sized this question.
  #   x: DifferenceOutOfRange        — the raw guessedDifference is negative (< 0). There is
  #                                    NO upper bound: a too-large guess is clamped at 100.
  # SubmitDifference carries no questionIndex; DifferenceSubmitted stamps the resolved one.
  ✍️ Submit Difference:
    steps:
      - t: 🧑‍🎓 Player /Question
      - c: SubmitDifference
        props:
          gameId: Guid
          playerId: Guid
          guessedDifference: decimal   # RAW absolute guess in the card's unit, >= 0 (NOT 0-100)
      - x: GameNotFound
      - x: GameNotStarted
      - x: PlayerNotInGame
      - x: DirectionNotRevealed
      - x: AlreadySubmittedDifference
      - x: DifferenceOutOfRange
      - e: Game / DifferenceSubmitted
        props:
          gameId: Guid
          playerId: Guid
          questionIndex: int
          guessedDifference: decimal   # RAW absolute guess in the card's unit, >= 0
          submittedAt: DateTimeOffset
      - v: Guess progress
    # Decider-true GWT: given the folded State / Game props `decide` reads — phase,
    # players, the current question's correctDirection (DirectionNotRevealed) and
    # differences (AlreadySubmittedDifference) — when SubmitDifference, then
    # DifferenceSubmitted | rejection. A negative raw guess is a command-value guard
    # (DifferenceOutOfRange); a too-large guess is clamped at 100 when scored.
    tests:
      difference submitted successfully:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0DirectionRevealed
        when:
          - c: SubmitDifference
            props: { gameId: gameId, playerId: nilsId, guessedDifference: 50 }
        then:
          - e: Game / DifferenceSubmitted
            props: { playerId: nilsId, questionIndex: 0, guessedDifference: 50, submittedAt: submittedAt }
      cannot submit difference before direction revealed:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0BothDirectionsIn   # correctDirection still null -> not revealed
        when:
          - c: SubmitDifference
            props: { gameId: gameId, playerId: nilsId, guessedDifference: 50 }
        then:
          - x: DirectionNotRevealed
      cannot submit difference twice on same question:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0NilsSized
        when:
          - c: SubmitDifference
            props: { gameId: gameId, playerId: nilsId, guessedDifference: 20 }
        then:
          - x: AlreadySubmittedDifference
      negative difference rejected:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0DirectionRevealed
        when:
          - c: SubmitDifference
            props: { gameId: gameId, playerId: nilsId, guessedDifference: -5 }   # raw guess < 0; a too-LARGE guess is clamped at 100, never rejected
        then:
          - x: DifferenceOutOfRange

  👀 Waiting For Others:
    steps:
      - v: Guess progress
        props:
          gameId: Guid
          questionIndex: int
          submittedPlayerIds: Guid[]
          pendingPlayerIds: Guid[]
    # Projection GT: given the current question received one submission, then the screen
    # splits players into who has submitted vs who is still pending. REUSED for both stages:
    # the pending set is derived from the ACTIVE stage — directions while stage 1 is open
    # (before QuestionDirectionRevealed), differences after. The GT exercises stage 1.
    tests:
      shows who has guessed and who is still pending:
        given:
          - e: Game / LobbyOpened
            props: { hostPlayerId: martinId, hostName: Martin, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
        then:
          - v: Guess progress
            props:
              questionIndex: 0
              submittedPlayerIds: [martinId]
              pendingPlayerIds: [nilsId]

  # --- Scoring (System processor) ------------------------------------------

  # Two minimal Todo read-models, one per gear of the twåstegsraket. Each renders the deck
  # as a real todo list: ONE row per question. Co-located play means only the CURRENT
  # question receives input, so the row that flips to "all in" is always the current one.
  #
  # Outstanding Directions gates ⚙️ System / Reveal direction (stage 1):
  #   { questionIndex, pendingPlayerIds, allDirectionsIn }. Each DirectionSubmitted checks
  #   off that player; allDirectionsIn = that row's pendingPlayerIds empty.
  📋 Outstanding Directions:
    steps:
      - v: Todo / Outstanding directions
        props:
          gameId: Guid
          questions: OutstandingDirection[]   # one row per question; OutstandingDirection = { questionIndex: int, pendingPlayerIds: Guid[], allDirectionsIn: bool }
    tests:
      every question opens for every player when the game starts:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
        then:
          - v: Todo / Outstanding directions
            props:
              questions:
                - od0AllPending
                - od1AllPending
      a submitted direction checks off that player on its question:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
        then:
          - v: Todo / Outstanding directions
            props:
              questions:
                - od0NilsPending
                - od1AllPending
      a question shows all directions in once every player has answered:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
          - e: Game / DirectionSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre }
        then:
          - v: Todo / Outstanding directions
            props:
              questions:
                - od0AllIn
                - od1AllPending

  # Outstanding Differences gates ⚙️ System / Score difference (stage 2):
  #   { questionIndex, pendingPlayerIds, allDifferencesIn, directionRevealed }. Each
  #   DifferenceSubmitted checks off that player; allDifferencesIn = pendingPlayerIds empty;
  #   directionRevealed flips on QuestionDirectionRevealed (the stage-1 → stage-2 gate).
  📋 Outstanding Differences:
    steps:
      - v: Todo / Outstanding differences
        props:
          gameId: Guid
          questions: OutstandingDifference[]   # one row per question; OutstandingDifference = { questionIndex: int, pendingPlayerIds: Guid[], allDifferencesIn: bool, directionRevealed: bool }
    tests:
      differences open only once the direction is revealed:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
          - e: Game / DirectionSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre }
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 0, correctDirection: mer }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: martinId, guessedDirection: mer, directionCorrect: true, bonusPoints: -10 }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: nilsId, guessedDirection: mindre, directionCorrect: false, bonusPoints: 0 }
          - e: Game / DifferenceSubmitted
            props: { playerId: martinId, questionIndex: 0, guessedDifference: 40 }
        then:
          - v: Todo / Outstanding differences
            props:
              questions:
                - of0NilsPending
                - of1AllPending
      a question shows all differences in once every player has sized it:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
          - e: Game / DirectionSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre }
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 0, correctDirection: mer }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: martinId, guessedDirection: mer, directionCorrect: true, bonusPoints: -10 }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: nilsId, guessedDirection: mindre, directionCorrect: false, bonusPoints: 0 }
          - e: Game / DifferenceSubmitted
            props: { playerId: martinId, questionIndex: 0, guessedDifference: 40 }
          - e: Game / DifferenceSubmitted
            props: { playerId: nilsId, questionIndex: 0, guessedDifference: 50 }
        then:
          - v: Todo / Outstanding differences
            props:
              questions:
                - of0AllIn
                - of1AllPending

  # STAGE 1 processor: once Outstanding directions shows allDirectionsIn, the System
  # reveals the correct direction (larger raw value -> mer) and deals the -10 bonus — the
  # mellansteg. Emits one QuestionDirectionRevealed plus one DirectionScored per player.
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: NotAllDirectionsIn       — a player is still pending stage 1.
  #   x: DirectionAlreadyRevealed — already revealed (guards a double fire).
  # Fixtures: question0 reveals mer, question1 reveals mindre; host = martinId, Nils = nilsId.
  ✍️ Reveal Direction:
    steps:
      - e: Game / DirectionSubmitted
      - v: Todo / Outstanding directions
      - t: ⚙️ System / Reveal direction
      - c: RevealDirection
        props:
          gameId: Guid
          questionIndex: int
      - x: NotAllDirectionsIn
      - x: DirectionAlreadyRevealed
      - e: Game / QuestionDirectionRevealed
        props:
          gameId: Guid
          questionIndex: int
          correctDirection: Direction (mer|mindre)   # derived = valueA >= valueB ? mer : mindre
      - e: Game / DirectionScored       # one per player
        props:
          gameId: Guid
          questionIndex: int
          playerId: Guid
          guessedDirection: Direction (mer|mindre)
          directionCorrect: bool
          bonusPoints: int                            # directionCorrect ? -10 : 0
      - v: Direction reveal
    # Decider-true GWT: given the folded State / Game, when RevealDirection, then the
    # events | rejection. allDirectionsIn is DERIVED: players == the current question's
    # directions keys.
    tests:
      all directions in reveals the answer and deals the bonus:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0BothDirectionsIn   # both in -> allDirectionsIn derived true
                - q1Fresh
        when:
          - c: RevealDirection
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 0, correctDirection: mer }
          - e: Game / DirectionScored
            props: { playerId: martinId, guessedDirection: mer, directionCorrect: true, bonusPoints: -10 }
          - e: Game / DirectionScored
            props: { playerId: nilsId, guessedDirection: mindre, directionCorrect: false, bonusPoints: 0 }
      cannot reveal before all directions in:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0MartinDirectionOnly   # nilsId missing -> allDirectionsIn derived false
                - q1Fresh
        when:
          - c: RevealDirection
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - x: NotAllDirectionsIn
      cannot reveal an already-revealed direction:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0DirectionRevealed   # already revealed
                - q1Fresh
        when:
          - c: RevealDirection
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - x: DirectionAlreadyRevealed

  # STAGE 2 processor: once Outstanding differences shows allDifferencesIn, the System
  # scores the magnitude. Balances the card's raw valueA/valueB onto 0-100 (correctDifference
  # = round(|A-B|/max(A,B)*100)), revealed once on QuestionDifferenceRevealed (the
  # progression gate), then emits one DifferenceScored per player carrying the combined
  # roundScore (difference points + the stage-1 bonus already in directionScores).
  # Failures are Result failure-track values, never thrown:
  #   x: NotAllDifferencesIn    — a player is still pending stage 2.
  #   x: QuestionAlreadyScored  — already scored (guards a double fire).
  # 'lowest score wins' is winner determination and lives on End Game, not here.
  ✍️ Score Difference:
    steps:
      - e: Game / DifferenceSubmitted
      - v: Todo / Outstanding differences
      - t: ⚙️ System / Score difference
      - c: ScoreDifference
        props:
          gameId: Guid
          questionIndex: int
      - x: NotAllDifferencesIn
      - x: QuestionAlreadyScored
      - e: Game / QuestionDifferenceRevealed
        props:
          gameId: Guid
          questionIndex: int
          correctDifference: byte (0-100)              # derived = round(|A-B|/max(A,B)*100)
      - e: Game / DifferenceScored       # one per player
        props:
          gameId: Guid
          questionIndex: int
          playerId: Guid
          guessedDifference: decimal                   # the RAW guess the player submitted (card's unit)
          guessedDifferenceNormalized: byte (0-100)    # derived = min(100, round(guessedDifference/max(A,B)*100))
          differencePoints: byte (0-100)               # = |guessedDifferenceNormalized - correctDifference|
          roundScore: int                              # differencePoints + stage-1 bonus (signed)
          totalScore: int                              # running sum over scored questions (signed)
      - v: Round scores
    # Decider-true GWT: given the folded State / Game (directionScores carry the stage-1
    # bonus), when ScoreDifference, then the events | rejection. allDifferencesIn is DERIVED:
    # players == the current question's differences keys. roundScore = differencePoints +
    # directionScores[p]; running totalScore sums roundScores across scored questions.
    tests:
      all differences scored and answer revealed:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0BothSized
                - q1Fresh
        when:
          - c: ScoreDifference
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - e: Game / QuestionDifferenceRevealed
            props: { questionIndex: 0, correctDifference: 40 }
          - e: Game / DifferenceScored
            props: { playerId: martinId, guessedDifference: 30, guessedDifferenceNormalized: 30, differencePoints: 10, roundScore: 0, totalScore: 0 }
          - e: Game / DifferenceScored
            props: { playerId: nilsId, guessedDifference: 50, guessedDifferenceNormalized: 50, differencePoints: 10, roundScore: 10, totalScore: 10 }
      exact difference with correct direction:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0MartinExact
                - q1Fresh
        when:
          - c: ScoreDifference
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - e: Game / QuestionDifferenceRevealed
            props: { questionIndex: 0, correctDifference: 40 }
          - e: Game / DifferenceScored
            props: { playerId: martinId, guessedDifference: 40, guessedDifferenceNormalized: 40, differencePoints: 0, roundScore: -10, totalScore: -10 }
          - e: Game / DifferenceScored
            props: { playerId: nilsId, guessedDifference: 50, guessedDifferenceNormalized: 50, differencePoints: 10, roundScore: 10, totalScore: 10 }
      scores accumulate across rounds:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 1
              players: [hostMartin, playerNils]
              questions:
                # question0 already scored -> its roundScores are the source of the running total
                - q0Scored
                - q1BothSized
        when:
          - c: ScoreDifference
            props: { gameId: gameId, questionIndex: 1 }
        then:
          - e: Game / QuestionDifferenceRevealed
            props: { questionIndex: 1, correctDifference: 20 }
          - e: Game / DifferenceScored
            props: { playerId: martinId, guessedDifference: 25, guessedDifferenceNormalized: 25, differencePoints: 5, roundScore: -5, totalScore: -5 }
          - e: Game / DifferenceScored
            props: { playerId: nilsId, guessedDifference: 20, guessedDifferenceNormalized: 20, differencePoints: 0, roundScore: -10, totalScore: 0 }
      cannot score before all differences in:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0MartinSizedOnly   # nilsId missing -> allDifferencesIn derived false
                - q1Fresh
        when:
          - c: ScoreDifference
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - x: NotAllDifferencesIn
      cannot score an already-scored question:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              players: [hostMartin, playerNils]
              questions:
                - q0Scored   # already scored -> double fire guarded
                - q1Fresh
        when:
          - c: ScoreDifference
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - x: QuestionAlreadyScored

  # The mellansteg between the two stages: stage 1 closed, direction revealed, the -10
  # bonus dealt — shown before the slider opens. Per-player directionCorrect + bonus +
  # the running total SO FAR (includes the just-awarded bonus, for drama).
  👀 Direction Results:
    steps:
      - v: Direction reveal
        props:
          gameId: Guid
          questionIndex: int
          correctDirection: Direction (mer|mindre)   # from QuestionDirectionRevealed
          playerDirections: PlayerDirectionResult[]  # { playerId: Guid, guessedDirection: Direction, directionCorrect: bool, bonusPoints: int, totalSoFar: int }
    # Projection GT: given the direction revealed (the reveal + one DirectionScored per
    # player), then the mellansteg shows the revealed direction and each player's bonus +
    # running total so far. totalSoFar = Σ scored roundScores + this question's bonus.
    tests:
      reveals the direction and the bonus once stage 1 closes:
        given:
          - e: Game / LobbyOpened
            props: { hostPlayerId: martinId, hostName: Martin, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
          - e: Game / DirectionSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre }
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 0, correctDirection: mer }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: martinId, guessedDirection: mer, directionCorrect: true, bonusPoints: -10 }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: nilsId, guessedDirection: mindre, directionCorrect: false, bonusPoints: 0 }
        then:
          - v: Direction reveal
            props:
              questionIndex: 0
              correctDirection: mer
              playerDirections:
                - pdMartin
                - pdNils

  👀 Round Results:
    steps:
      - v: Round scores
        props:
          gameId: Guid
          questionIndex: int
          correctDirection: Direction (mer|mindre)   # from QuestionDirectionRevealed
          correctDifference: byte (0-100)            # from QuestionDifferenceRevealed
          playerScores: PlayerScore[]  # { playerId: Guid, roundScore: int, totalScore: int } from per-player DifferenceScored
    # Projection GT: given the question fully scored (both reveals + per-player DirectionScored
    # and DifferenceScored), then the results screen shows the revealed answer and each
    # player's combined round + running total. correctDirection from QuestionDirectionRevealed,
    # correctDifference from QuestionDifferenceRevealed; scores from DifferenceScored.
    tests:
      reveals the answer and per-player scores once scored:
        given:
          - e: Game / LobbyOpened
            props: { hostPlayerId: martinId, hostName: Martin, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
          - e: Game / DirectionSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre }
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 0, correctDirection: mer }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: martinId, guessedDirection: mer, directionCorrect: true, bonusPoints: -10 }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: nilsId, guessedDirection: mindre, directionCorrect: false, bonusPoints: 0 }
          - e: Game / DifferenceSubmitted
            props: { playerId: martinId, questionIndex: 0, guessedDifference: 30 }
          - e: Game / DifferenceSubmitted
            props: { playerId: nilsId, questionIndex: 0, guessedDifference: 50 }
          - e: Game / QuestionDifferenceRevealed
            props: { questionIndex: 0, correctDifference: 40 }
          - e: Game / DifferenceScored
            props: { questionIndex: 0, playerId: martinId, roundScore: 0, totalScore: 0 }
          - e: Game / DifferenceScored
            props: { questionIndex: 0, playerId: nilsId, roundScore: 10, totalScore: 10 }
        then:
          - v: Round scores
            props:
              questionIndex: 0
              correctDirection: mer
              correctDifference: 40
              playerScores:
                - psMartin0
                - psNils10

  # --- Progression (System processor) --------------------------------------

  # Minimal Todo read-model the progression processors gate on. The whole deck is on
  # the stream (LobbyOpened carries questions), so totalQuestions = questions.Count and
  # scoredQuestionCount / hasNextQuestion are projected as each question is answered.
  # hasNextQuestion is the gate: true -> ⚙️ Ask next question, false -> ⚙️ End game
  # (mutually exclusive). SEPARATE from State / Game, kept minimal. GT below proves it.
  📋 Game Progress:
    steps:
      - v: Todo / Game progress
        props:
          gameId: Guid
          questionIndex: int
          totalQuestions: int
          scoredQuestionCount: int
          hasNextQuestion: bool
    tests:
      progress shows a next question while questions remain:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 0, correctDirection: mer }
          - e: Game / QuestionDifferenceRevealed
            props: { questionIndex: 0, correctDifference: 40 }
        then:
          - v: Todo / Game progress
            props: { questionIndex: 0, totalQuestions: 2, scoredQuestionCount: 1, hasNextQuestion: true }
      progress shows no next question once the last is scored:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 0, correctDirection: mer }
          - e: Game / QuestionDifferenceRevealed
            props: { questionIndex: 0, correctDifference: 40 }
          - e: Game / NextQuestionStarted
            props: { questionIndex: 1 }
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 1, correctDirection: mindre }
          - e: Game / QuestionDifferenceRevealed
            props: { questionIndex: 1, correctDifference: 20 }
        then:
          - v: Todo / Game progress
            props: { questionIndex: 1, totalQuestions: 2, scoredQuestionCount: 2, hasNextQuestion: false }

  # Maps the lilac "möjliggör / ställ nästa fråga" on the board. Fires when
  # Game progress shows hasNextQuestion. Presents the next question by index.
  ✍️ Ask Next Question:
    steps:
      - e: Game / QuestionDifferenceRevealed
      - v: Todo / Game progress
      - t: ⚙️ System / Ask next question
      - c: AskNextQuestion
        props:
          gameId: Guid
      - e: Game / NextQuestionStarted
        props:
          gameId: Guid
          questionIndex: int
      - v: Question card
    # Decider-true GWT: given the folded State / Game (current question scored, another
    # remains — hasNextQuestion derived true), when AskNextQuestion, then
    # NextQuestionStarted at the next index. The gate is verified by Game progress' GT.
    tests:
      next question presented when one remains:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              questions:
                - q0Scored
                - q1Fresh
        when:
          - c: AskNextQuestion
            props: { gameId: gameId }
        then:
          - e: Game / NextQuestionStarted
            props: { questionIndex: 1 }

  # --- End (System processor) ----------------------------------------------

  # Fires when Game progress shows NOT hasNextQuestion (mutually exclusive with Ask Next
  # Question; both react to QuestionDifferenceRevealed and the gate decides which fires).
  # Computes the final scoreboard from each player's DERIVED totalScore; winnerIds = ALL
  # players tied at the lowest total (lowest score wins; ties share the win).
  ✍️ End Game:
    steps:
      - e: Game / QuestionDifferenceRevealed
      - v: Todo / Game progress
      - t: ⚙️ System / End game
      - c: EndGame
        props:
          gameId: Guid
      - e: Game / GameEnded
        props:
          gameId: Guid
          finalScoreboard: ScoreboardEntry[]   # { playerId: Guid, playerName: string, totalScore: int }
          winnerIds: Guid[]                     # all players tied at the lowest total
          endedAt: DateTimeOffset
      - v: Scoreboard
    # Decider-true GWT: given the folded State / Game (all questions scored, none left —
    # hasNextQuestion derived false), when EndGame, then GameEnded with the scoreboard and
    # the lowest-total winner(s). No x: — the hasNextQuestion gate makes End Game / Ask Next
    # mutually exclusive and each fires once per QuestionDifferenceRevealed.
    tests:
      lowest score wins:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 1
              players: [hostMartin, playerNils]
              questions:
                - q0Scores0And10
                - q1Scores5And0
        when:
          - c: EndGame
            props: { gameId: gameId }
        then:
          - e: Game / GameEnded
            props:
              finalScoreboard:
                - sbMartin5
                - sbNils10
              winnerIds: [martinId]   # martin lowest total (5 < 10)
              endedAt: endedAt
      tied lowest totals share the win:
        given:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 1
              players: [hostMartin, playerNils]
              questions:
                - q0Scores5Each
                - q1Scores5Each
        when:
          - c: EndGame
            props: { gameId: gameId }
        then:
          - e: Game / GameEnded
            props:
              finalScoreboard:
                - sbMartin10
                - sbNils10
              winnerIds: [martinId, nilsId]   # equal lowest total -> shared win
              endedAt: endedAt

  👀 Final Standings:
    steps:
      - v: Scoreboard
        props:
          gameId: Guid
          finalScoreboard: ScoreboardEntry[]   # { playerId: Guid, playerName: string, totalScore: int }
          winnerIds: Guid[]   # all players tied at the lowest total
    # Projection GT: GameEnded already carries the computed scoreboard + winnerIds (lowest
    # total wins; ties share), so the final screen projects them straight through.
    tests:
      shows the final scoreboard and winner:
        given:
          - e: Game / GameEnded
            props:
              finalScoreboard:
                - sbMartin5
                - sbNils10
              winnerIds: [martinId]
              endedAt: endedAt
        then:
          - v: Scoreboard
            props:
              finalScoreboard:
                - sbMartin5
                - sbNils10
              winnerIds: [martinId]

  # --- Decision model (decider State) — APPENDIX, not a timeline step ------

  # Placed LAST on purpose: the slices above read top-to-bottom as the story
  # (catalog -> lobby -> join -> start -> guess -> score -> next -> end). This box
  # is NOT a moment in that timeline — it is the folded GameState the decider's
  # `decide` reads, referenced by the Given of every command/processor slice above.
  # State / Game is the SINGLE decision model (one Decider per game, one State).
  # emlang has no `state` element, so every command/processor slice expresses its
  # Given as this view (see
  # docs/adr/decider-pattern.svg: Given = prior events -> state via evolve). A GWT
  # case asserts only the props its `decide` actually reads. This box is distinct from
  # the minimal Todo / read-models the System processors gate on — an event feeds both.
  #
  # The game loads the WHOLE deck up front (questions: QuestionRound[]) and players'
  # guesses fold into each question as they arrive — one cohesive structure, not a deck
  # plus a separate current-only guess map. A QuestionRound is the immutable card plus
  # how it is being answered. Everything about progress/pending/totals is DERIVED from
  # questions + players (see "derived" note on the props), so the fold keeps a single
  # source of truth and no redundant flags.
  #
  # QuestionRound fixtures (card = a Question fixture; directions/directionScores/
  # differences/roundScores are maps keyed by playerId; value objects never repeat the key).
  # Tests reference rounds by fixture NAME (q0Fresh, q0Scored, …); the generated SpecTests
  # resolve each name to Fixtures.* in the test project (ADR 017). The stage-1 map holds
  # a bare Direction per player; the stage-2 map a raw decimal guessedDifference. Both
  # fixture cards have mx=100, so a raw guessedDifference d (0<=d<=100) normalizes to itself.
  #
  # Player fixtures (Player = { playerId: Guid, name: string, isHost: bool }), reused by
  # the Join / Start / Submit GWTs:
  #   hostMartin = { playerId: martinId, name: Martin, isHost: true }
  #   playerNils = { playerId: nilsId,   name: Nils,   isHost: false }
  #   playerSven = { playerId: svenId,   name: Sven,   isHost: false }
  👀 Decision Model:
    steps:
      - v: State / Game
        props:
          gameId: Guid
          joinCode: Guid
          phase: GamePhase (lobby|started|ended)
          hostPlayerId: Guid
          players: Player[]              # { playerId: Guid, name: string, isHost: bool }
          currentQuestionIndex: int
          questions: IReadOnlyList<QuestionRound>   # the fixed deck loaded up front + how each is being answered
          # QuestionRound = {
          #   card: Question,                                 # immutable card from LobbyOpened: { questionText, itemA, itemB: string; valueA, valueB: decimal; unit, differencePrompt: string } — raw values, no precomputed answer
          #   directions: IReadOnlyDictionary<Guid, Direction>,   # STAGE 1: this question's direction guesses; key=playerId, value = mer|mindre
          #   correctDirection: Direction? (mer|mindre),          # revealed in stage 1 (null before)
          #   directionScores: IReadOnlyDictionary<Guid, int>,    # per-player stage-1 bonus (-10|0), set at reveal; key=playerId
          #   differences: IReadOnlyDictionary<Guid, decimal>,    # STAGE 2: this question's RAW magnitude guesses (>= 0); key=playerId
          #   correctDifference: byte? (0-100),                   # revealed in stage 2 (null before); derived from the raw card values
          #   roundScores: IReadOnlyDictionary<Guid, int>,        # per-player combined round score, set when scored; key=playerId
          #   scored: bool }
          # DERIVED (computed, NOT stored — single source of truth in questions + players):
          #   pendingDirectionPlayerIds(i)  = players.Keys − questions[i].directions.Keys
          #   allDirectionsIn(i)            = pendingDirectionPlayerIds(i) is empty
          #   directionRevealed(i)          = questions[i].correctDirection is not null
          #   pendingDifferencePlayerIds(i) = players.Keys − questions[i].differences.Keys
          #   allDifferencesIn(i)           = pendingDifferencePlayerIds(i) is empty
          #   currentQuestionScored         = questions[currentQuestionIndex].scored
          #   hasNextQuestion               = currentQuestionIndex + 1 < questions.Count
          #   totalScore(p)                 = Σ over scored questions of roundScores[p]
    tests:
      state folds a direction into the decision model:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
        then:
          - v: State / Game
            props:
              phase: started
              hostPlayerId: martinId
              currentQuestionIndex: 0
              questions:
                - q0MartinDirectionOnly   # nilsId still pending (derived)
                - q1Fresh
      scoring a question folds both reveals and round scores into that question:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId, questions: [question0, question1] }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / DirectionSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer }
          - e: Game / DirectionSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre }
          - e: Game / QuestionDirectionRevealed
            props: { questionIndex: 0, correctDirection: mer }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: martinId, guessedDirection: mer, directionCorrect: true, bonusPoints: -10 }
          - e: Game / DirectionScored
            props: { questionIndex: 0, playerId: nilsId, guessedDirection: mindre, directionCorrect: false, bonusPoints: 0 }
          - e: Game / DifferenceSubmitted
            props: { playerId: martinId, questionIndex: 0, guessedDifference: 30 }
          - e: Game / DifferenceSubmitted
            props: { playerId: nilsId, questionIndex: 0, guessedDifference: 50 }
          - e: Game / QuestionDifferenceRevealed
            props: { questionIndex: 0, correctDifference: 40 }
          - e: Game / DifferenceScored
            props: { questionIndex: 0, playerId: martinId, roundScore: 0, totalScore: 0 }
          - e: Game / DifferenceScored
            props: { questionIndex: 0, playerId: nilsId, roundScore: 10, totalScore: 10 }
        then:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0   # scoring does not advance; AskNextQuestion does
              questions:
                # question0 fully scored: both reveals + per-player round scores folded in
                # (totalScore is DERIVED by summing roundScores across scored questions: martin 0, nils 10)
                - q0Scored
                - q1Fresh

